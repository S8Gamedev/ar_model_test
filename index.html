<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game model</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
    <h2>Cloudflare r2 AR Test </h2>
    <model-viewer
    id = "mv"
    src = "https://pub-1ece401edc4d4d4a8d083baf329473a1.r2.dev/testing/character.glb"
    ar 
    
    camera-controls
    styles="width: 100%; height:100%px">

    </model-viewer>
    <script>
        const viewer = document.getElementById("mv");

        // initial values
        let theta = 0; // horizontal rotation
        let phi = 75;  // vertical angle
        let radius = 2; // zoom

        function updateCamera() {
        viewer.cameraOrbit = `${theta}deg ${phi}deg ${radius}m`;
        }

        // keyboard controls
        window.addEventListener("keydown", (e) => {
        switch(e.key) {
            case "ArrowLeft":
            theta -= 5;
            break;
            case "ArrowRight":
            theta += 5;
            break;
            case "ArrowUp":
            phi = Math.max(10, phi - 5);
            break;
            case "ArrowDown":
            phi = Math.min(170, phi + 5);
            break;
            case "+":
            radius = Math.max(1, radius - 0.2);
            break;
            case "-":
            radius += 0.2;
            break;
        }
        updateCamera();
        });
    </script>
</body>
</html>
